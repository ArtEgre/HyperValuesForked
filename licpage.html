<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperValuesForked - License</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
    <script src="translations.js"></script>
    <script src="i18n.js"></script>
    <script src="hyper-i18n.js"></script>
</head>
<body>
    <div class="main-container">
    <h1 class="brand-title">HyperValuesForked</h1>
    
    <section id="credits" class="description-box">
        <h2 data-i18n="creditsTitle">Credits</h2>
        <p data-i18n-html="creditsLineage"></p>
        <p data-i18n-html="creditsAssets"></p>
        <p><a href="https://github.com/ArtEgre/HyperValuesForked/blob/main/CREDITS.md" data-i18n="creditsDetails">Full credits and icon sources</a></p>
    </section>

    <div class="license-container">
        <div class="license-bubble">
            <pre id="license-text" style="white-space: pre-wrap; font-family: inherit; margin: 0;">Loading license...</pre>
        </div>
    </div>

    <div class="license-footer">
    <div id="buttons">
        <button onclick="location.href='index.html'">Back</button>
    </div>
</div>
</div>

<script>
    fetch('LICENSE')
        .then(response => {
            if (!response.ok) {
                throw new Error('Could not load LICENSE file');
            }
            return response.text();
        })
        .then(data => {
            document.getElementById('license-text').innerText = data;
        })
        .catch(error => {
            document.getElementById('license-text').innerText = 'Error loading license: ' + error.message;
        });
</script>
</body>
</html>
