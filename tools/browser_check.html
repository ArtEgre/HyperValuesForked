<!doctype html><html lang="en"><meta charset="utf-8"><title>HyperValuesForked browser checks</title>
<body><pre id="report">RUNNING</pre><iframe id="app" style="width:390px;height:844px"></iframe>
<script>
const output = [];
const report = document.getElementById('report');
const frame = document.getElementById('app');
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
function check(ok, message) { if (!ok) throw new Error(message); output.push('PASS ' + message); report.textContent = output.join('\n'); }
async function until(predicate) { for (let i = 0; i < 200; i++) { if (predicate()) return; await wait(50); } throw new Error('Timed out'); }
async function open(page) {
    await new Promise(resolve => { frame.onload = resolve; frame.src = new URL('../' + page, location.href); });
    await until(() => frame.contentWindow.document.readyState === 'complete');
    return frame.contentWindow;
}
(async () => {
    let w = await open('index.html');
    w.localStorage.clear();
    w = await open('index.html');
    check(w.document.querySelector('h1').textContent === 'HyperValuesForked', 'HyperValuesForked branding');
    check(!!w.document.querySelector('button[data-i18n="customResults"]'), 'custom results in menu');
    w.toggleTheme();
    check(w.document.documentElement.dataset.theme === 'light', 'theme toggles');
    w = await open('values.html');
    check(w.document.querySelectorAll('.result-item').length === 145, '145 values render');
    for (const lang of ['uk', 'ru', 'de', 'en']) {
        w.eval(`I18n.setLanguage('${lang}')`);
        check(w.document.documentElement.lang === lang && w.document.querySelectorAll('.result-item').length === 145, lang + ' value catalog');
    }
    w = await open('ideologies.html');
    check(w.document.querySelectorAll('.label-bubble').length === 239, '239 ideologies render');
    w = await open('results.html');
    check(w.document.querySelectorAll('.add-icon').length === 9, 'nine quiz categories');
    w = await open('quiz.html?cat=economics');
    await until(() => w.document.querySelectorAll('#buttons button').length > 1);
    const first = w.document.getElementById('question').textContent;
    w.eval("I18n.setLanguage('de')");
    check(w.document.getElementById('question').textContent !== first, 'quiz translates without losing position');
    w.eval("I18n.setLanguage('en')");
    w.document.querySelector('#buttons button').click();
    await wait(100);
    w.document.querySelector('#buttons button:last-child').click();
    check(w.document.getElementById('question').textContent === first, 'quiz back navigation');
    for (let i = 0; i < 20; i++) {
        if (frame.contentWindow.location.pathname.endsWith('/results.html')) break;
        frame.contentWindow.document.querySelector('#buttons button').click();
        await wait(150);
    }
    await until(() => frame.contentWindow.location.pathname.endsWith('/results.html') && frame.contentWindow.document.querySelectorAll('.result-agree').length > 0);
    w = frame.contentWindow;
    check(!!w.document.querySelector('#label a'), 'quiz saves an answer and ranks ideologies');
    const before = w.localStorage.getItem('quizAnswers');
    const answers = JSON.parse(before);
    const cat = Object.keys(answers)[0];
    const value = answers[cat][0].value;
    w = await open(`description.html?id=${value}&cat=${cat}&edit=1`);
    const slider = w.document.querySelector('input[type="range"]');
    check(!!slider, 'signed slider renders');
    slider.value = -60;
    slider.dispatchEvent(new w.Event('input'));
    check(JSON.parse(w.localStorage.getItem('quizAnswers'))[cat][0].agree === -0.6, 'slider persists negative agreement');
    w.eval("I18n.setLanguage('uk')");
    check(w.document.querySelector('.slider-word').textContent !== 'Moderately opposite', 'slider translates in place');
    w = await open('description.html?id=subsidiarity&cat=territorial_organization');
    check(w.document.getElementById('icon-source-btn').style.display === 'none' && w.document.getElementById('original-work-sign').dataset.i18n === 'aiGenerated', 'AI icon source label');
    w = await open('description.html?id=Agorism&type=ideology');
    check(w.document.querySelectorAll('#ideology-viewer .result-item').length > 0, 'new ideology stance viewer');
    w = await open('custom.html');
    const quizSaved = w.localStorage.getItem('quizAnswers');
    const select = w.document.querySelector('select');
    select.value = 'social_market';
    select.dispatchEvent(new w.Event('change'));
    check(w.document.querySelectorAll('.custom-value').length === 1 && !!w.document.querySelector('#custom-matches a'), 'custom selection and ranking');
    check(w.localStorage.getItem('quizAnswers') === quizSaved, 'custom results do not alter quiz answers');
    w = await open('custom.html');
    check(w.document.querySelectorAll('.custom-value').length === 1, 'custom selections survive reload');
    w.eval("I18n.setLanguage('de')");
    check(w.document.querySelectorAll('.custom-value').length === 1 && w.document.getElementById('reset-custom').textContent !== 'Reset', 'custom editor language switch preserves values');
    w.document.getElementById('reset-custom').click();
    check(w.localStorage.getItem('customQuizAnswers') === '{}' && w.localStorage.getItem('quizAnswers') === quizSaved, 'custom reset is independent');
    w = await open('results.html');
    w.downloaded = [];
    w.HTMLAnchorElement.prototype.click = function () { w.downloaded.push(this.download); };
    const imageResult = await w.eval('HVImage.download(HV.loadAnswers(), 1)');
    check(imageResult.phone === 1 && imageResult.computer === 1 && w.downloaded.length === 2, 'phone and computer images render');
    check(w.document.documentElement.scrollWidth <= w.innerWidth + 1, 'mobile results fit the viewport');
    report.textContent = output.join('\n') + '\nALL BROWSER CHECKS PASSED';
})().catch(error => { report.textContent = output.join('\n') + '\nFAIL ' + error.stack; });
</script></body></html>
